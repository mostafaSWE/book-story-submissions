# Local Supabase-like database for tests: Postgres + PostgREST (+ tests/db/rest-proxy.mjs for /rest/v1).
# Applies the repo's real migrations, in order, on first start.
#   docker compose -f sites/anta/tests/db/docker-compose.yml up -d
name: anta-testdb
services:
  db:
    image: postgres:17-bookworm   # production runs Postgres 17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["54329:5432"]
    volumes:
      - ./00-supabase-roles.sql:/docker-entrypoint-initdb.d/00-supabase-roles.sql:ro
      - ../../../../supabase/migrations/20260606000000_create_submissions.sql:/docker-entrypoint-initdb.d/10-create_submissions.sql:ro
      - ../../../../supabase/migrations/20260630120000_add_terms_consent.sql:/docker-entrypoint-initdb.d/11-add_terms_consent.sql:ro
      - ../../../../supabase/migrations/20261001000000_create_anta_contributions.sql:/docker-entrypoint-initdb.d/20-create_anta_contributions.sql:ro
      - ../../../../supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-test-jwt-secret-at-least-32-characters-long
    ports: ["54330:3000"]
